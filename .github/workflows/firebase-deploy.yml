name: Deploy CRM to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Firebase Secret
        id: check_secret
        run: |
          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT_FIVENIGHTS_FUN_CRM }}" ]; then
            echo "has_secret=true" >> $GITHUB_OUTPUT
          else
            echo "has_secret=false" >> $GITHUB_OUTPUT
            echo "FIREBASE_SERVICE_ACCOUNT_FIVENIGHTS_FUN_CRM secret not configured in GitHub repository. Deployments are done via local authenticated CLI."
          fi

      - name: Deploy to Firebase Hosting
        if: steps.check_secret.outputs.has_secret == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FIVENIGHTS_FUN_CRM }}
          projectId: fivenights-fun-crm
          channelId: live
